name: Bug report
description: Report a reproducible issue
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenCob version
      placeholder: e.g. 0.1.0
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Share exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or screenshots.
