version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge-candidate
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: '/docs'
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: '/packages/core'
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: '/packages/cli'
    schedule:
      interval: weekly
      day: monday
      time: '06:40'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: '/packages/extension'
    schedule:
      interval: weekly
      day: monday
      time: '06:50'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
