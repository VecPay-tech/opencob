<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#0a0a0a"/>
  
  <!-- Body - robot torso -->
  <rect x="40" y="76" width="48" height="32" rx="6" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.5"/>
  
  <!-- Body screen/chest display -->
  <rect x="48" y="80" width="32" height="16" rx="3" fill="#0d1a0d" stroke="#33ff33" stroke-width="0.8"/>
  <line x1="51" y1="85" x2="68" y2="85" stroke="#33ff33" stroke-width="1" opacity="0.8"/>
  <line x1="51" y1="89" x2="75" y2="89" stroke="#33ff33" stroke-width="1" opacity="0.6"/>
  <line x1="51" y1="93" x2="63" y2="93" stroke="#33ff33" stroke-width="1" opacity="0.7"/>
  
  <!-- Neck -->
  <rect x="58" y="70" width="12" height="7" rx="2" fill="#1a1a1a" stroke="#33ff33" stroke-width="1"/>
  
  <!-- CORN COB HEAD - clean rounded shape -->
  <rect x="46" y="20" width="36" height="52" rx="18" fill="#2d5a00" stroke="#33ff33" stroke-width="1.5"/>
  

  
  <!-- Husk leaves peeling back (left) -->
  <path d="M46 30 Q36 38 35 50 Q37 60 43 68" fill="#1a3d00" fill-opacity="0.6" stroke="#33ff33" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Husk leaves peeling back (right) -->
  <path d="M82 30 Q92 38 93 50 Q91 60 85 68" fill="#1a3d00" fill-opacity="0.6" stroke="#33ff33" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Corn silk on top - just 3 center strands -->
  <path d="M61 20 Q60 12 58 6" fill="none" stroke="#33ff33" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M64 20 Q64 11 64 4" fill="none" stroke="#33ff33" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M67 20 Q68 12 70 6" fill="none" stroke="#33ff33" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Eyes -->
  <!-- Left eye - open -->
  <rect x="53" y="35" width="10" height="8" rx="2" fill="#0d1a0d" stroke="#33ff33" stroke-width="1.2"/>
  <rect x="56" y="37" width="4" height="4" rx="1" fill="#33ff33"/>
  <rect x="57" y="38" width="2" height="2" fill="#88ff88"/>
  <!-- Right eye - closed (wink) < shape -->
  <path d="M77 35 L70 39 L77 43" fill="none" stroke="#33ff33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Mouth - open happy smile -->
  <path d="M57 54 Q64 61 71 54" fill="#0d1a0d" stroke="#33ff33" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Arms -->
  <rect x="28" y="78" width="10" height="24" rx="5" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <rect x="90" y="78" width="10" height="24" rx="5" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <circle cx="33" cy="78" r="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1"/>
  <circle cx="95" cy="78" r="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1"/>
  <!-- Simple round hands (no fingers) -->
  <circle cx="33" cy="104" r="5" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <circle cx="95" cy="104" r="5" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  
  <!-- Legs -->
  <rect x="48" y="108" width="10" height="12" rx="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <rect x="70" y="108" width="10" height="12" rx="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <!-- Feet -->
  <ellipse cx="53" cy="122" rx="8" ry="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  <ellipse cx="75" cy="122" rx="8" ry="4" fill="#1a1a1a" stroke="#33ff33" stroke-width="1.2"/>
  
  <!-- Subtle CRT scanlines -->
  <line x1="0" y1="16" x2="128" y2="16" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="32" x2="128" y2="32" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="48" x2="128" y2="48" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="64" x2="128" y2="64" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="80" x2="128" y2="80" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="96" x2="128" y2="96" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
  <line x1="0" y1="112" x2="128" y2="112" stroke="#33ff33" stroke-width="0.2" opacity="0.06"/>
</svg>
